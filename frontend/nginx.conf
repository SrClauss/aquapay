# HTTP → HTTPS redirect
server {
    listen 80;
    server_name aguapay.com.br www.aguapay.com.br;
    return 301 https://aguapay.com.br$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name aguapay.com.br www.aguapay.com.br;

    ssl_certificate     /etc/letsencrypt/live/aguapay.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aguapay.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location /media/ {
        set $upstream_minio minio;
        rewrite ^/media/(.*) /aquapay-media/$1 break;
        proxy_pass http://$upstream_minio:9000;
        proxy_set_header Host $host;
    }

    location /api/blog/ {
        set $upstream_blog blog;
        rewrite ^/api/blog/(.*) /$1 break;
        proxy_pass http://$upstream_blog:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream_web web;
        proxy_pass http://$upstream_web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
