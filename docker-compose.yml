version: "3.9"

services:
  web:
    build: ./frontend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production

  blog:
    build: ./blog
    expose:
      - "8000"
    volumes:
      - blog_data:/app
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - web
      - blog
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  blog_data:
